<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet &amp; Voltage — Tactical Heist</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #070b12;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    width: 100%;
    height: 100%;
    max-width: 1280px;
    max-height: 720px;
    aspect-ratio: 16 / 9;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Velvet and Voltage tactical heist game"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
